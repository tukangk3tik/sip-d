name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Test
        run: python3 -m pytest -q
      - name: Check Gunicorn configuration
        run: python3 -m gunicorn --check-config sipd.wsgi:app
      - name: Package deployment source
        run: tar -czf sip-d-python.tar.gz sipd static deploy requirements.txt migrations.sql
      - uses: actions/upload-artifact@v4
        with:
          name: sip-d-python
          path: sip-d-python.tar.gz
          if-no-files-found: error

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: sip-d-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sip-d-python
          path: .
      - name: Verify deployment password is configured
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: test -n "$DEPLOY_SSH_PASSWORD"
      - name: Upload Python release to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: sip-d-python.tar.gz
          target: /tmp/
      - name: Install and health-check Flask deployment
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            sudo install -d -o root -g root -m 0755 /opt/sip-d
            sudo tar --no-same-owner -xzf /tmp/sip-d-python.tar.gz -C /opt/sip-d
            sudo test -x /opt/sip-d/venv/bin/python || sudo python3 -m venv /opt/sip-d/venv
            sudo /opt/sip-d/venv/bin/pip install -r /opt/sip-d/requirements.txt
            sudo install -o root -g root -m 0644 /opt/sip-d/deploy/sip-d-python.service /etc/systemd/system/sip-d-python.service
            sudo systemctl daemon-reload
            was_go=0
            if sudo systemctl is-active --quiet sip-d; then was_go=1; sudo systemctl stop sip-d; fi
            sudo systemctl enable --now sip-d-python
            if ! curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8090/healthz; then
              sudo systemctl stop sip-d-python
              if [ "$was_go" = 1 ]; then sudo systemctl start sip-d; fi
              exit 1
            fi
